name: Multiplayer match
on: [pull_request]
permissions:
  contents: read
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: geo-frontend
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geobattles/geobattles-backend
          ref: 1fb2a57b377d730ba9a3a1232d95524636a95bf1
          path: geo-backend
          persist-credentials: false
      - uses: ./geo-frontend/.github/actions/check-match
