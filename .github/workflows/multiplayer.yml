name: Multiplayer match
on: [pull_request]
permissions:
  contents: read
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: geo-frontend
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geobattles/geobattles-backend
          ref: ad56345a3ce99e196f14418623c0209a7eef2b4b
          path: geo-backend
          persist-credentials: false
      - uses: ./geo-frontend/.github/actions/check-match
